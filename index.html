<script>
var $=function(i){return document.getElementById(i)},D=null,P=[],SL=[],IM={},ST='',ang=0,vel=0,mode='',busy=0,ready=false,first=true,started=false,lastIx=-1,lastTk=0,bg=null,sa=null,mute=ls('mute')=='1',COL=['#b9c8ee','#fde8d3'],TX=['#1c2f6b','#9a1b2e'],FONT='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif',GE=['pointerup','touchend','click','keydown'];
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}}
function aud(){if(bg)return;bg=new Audio('nhac-nen.mp3');sa=new Audio('tieng-quay.mp3');bg.loop=sa.loop=true;bg.volume=.35;sa.volume=.9;bg.preload='auto';sa.preload='auto';bg.muted=sa.muted=mute;bg.addEventListener('playing',function(){started=true;disarm();var g=$('gate');if(g)g.remove()})}
function ac(){var A=window.AC=window.AC||new(window.AudioContext||window.webkitAudioContext)();if(A.state=='suspended')A.resume();return A}
function beep(f,d,v,ty){if(mute)return;try{var A=ac(),o=A.createOscillator(),g=A.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.value=v||.12;g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d)}catch(e){}}
function tick(){var n=performance.now();if(n-lastTk<55)return;lastTk=n;beep(1500,.03,.035,'square')}
function play(a){if(a&&!mute)a.play().catch(function(){})}
function snow(){var f=document.createDocumentFragment(),n=innerWidth<500?12:20;for(var i=0;i<n;i++){var s=document.createElement('i'),z=3+Math.random()*5;s.className='sn';s.style.cssText='left:'+Math.random()*100+'vw;width:'+z+'px;height:'+z+'px;animation-duration:'+(8+Math.random()*9)+'s;animation-delay:-'+Math.random()*12+'s';f.appendChild(s)}document.body.appendChild(f)}
function mu(){$('mute').className='mute'+(mute?' off':'');$('mute').setAttribute('aria-pressed',mute?'true':'false')}
function ui(){if(busy)return;var b=$('sp');b.disabled=!ready;b.textContent=ready?'QUAY NGAY':'Đang tải dữ liệu…'}
function clean(s){return String(s||'').replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'').replace(/\s+/g,' ').trim()}
function gest(e){if(started||mute)return;if(e.target&&e.target.closest&&e.target.closest('#mute'))return;aud();var p=bg.play();if(p&&p.catch)p.catch(function(){})}
function arm(){GE.forEach(function(t){document.addEventListener(t,gest,true)})}
function disarm(){GE.forEach(function(t){document.removeEventListener(t,gest,true)})}
function tryPlay(){if(started||mute)return;aud();var p=bg.play();if(p&&p.catch)p.catch(function(){})}
document.addEventListener('visibilitychange',function(){if(!bg)return;if(document.hidden){bg.pause();sa.pause()}else{play(bg);if(mode)play(sa)}});
$('mute').onclick=function(){aud();if(!started&&!mute){var p=bg.play();if(p&&p.catch)p.catch(function(){});return}mute=!mute;ls('mute',mute?'1':'0');bg.muted=sa.muted=mute;mu();if(!mute)play(bg)};
function rim(){var x=$('rim').getContext('2d'),g=x.createRadialGradient(360,360,300,360,360,360);g.addColorStop(0,'#ffb347');g.addColorStop(.6,'#ff8a1f');g.addColorStop(1,'#d9550a');x.beginPath();x.arc(360,360,358,0,7);x.fillStyle=g;x.fill();x.beginPath();x.arc(360,360,322,0,7);x.fillStyle='#8a3a06';x.fill();x.beginPath();x.arc(360,360,330,0,7);x.strokeStyle='#ffe08a';x.lineWidth=3;x.stroke();for(var i=0;i<24;i++){var t=i*Math.PI/12;x.beginPath();x.arc(360+342*Math.cos(t),360+342*Math.sin(t),9,0,7);x.fillStyle=i%2?'#fff3a0':'#ffffff';x.shadowColor='#fff3a0';x.shadowBlur=14;x.fill()}}
function two(s){s=String(s);if(s.length<=11)return[s];var m=s.length>>1,b=-1,i;for(i=0;i<s.length;i++)if(s[i]==' '&&(b<0||Math.abs(i-m)<Math.abs(b-m)))b=i;return b<0?[s.slice(0,11),s.slice(11,22)]:[s.slice(0,b),s.slice(b+1)]}
function mk(){var n=P.length,k,i;SL=[];if(!n)return;k=Math.ceil(8/n);while((n*k)%2)k++;for(i=0;i<n*k;i++)SL.push(P[i%n])}
function draw(){var x=$('wh').getContext('2d'),m=SL.length,a=2*Math.PI/(m||1);x.clearRect(0,0,640,640);
if(!m){for(var e=0;e<8;e++){x.beginPath();x.moveTo(320,320);x.arc(320,320,312,-Math.PI/2+e*Math.PI/4,-Math.PI/2+(e+1)*Math.PI/4);x.closePath();x.fillStyle=COL[e%2];x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke()}x.beginPath();x.arc(320,320,170,0,7);x.fillStyle='rgba(255,255,255,.94)';x.fill();x.fillStyle='#9a1b2e';x.font='700 30px '+FONT;x.textAlign='center';var t=ready?['Quà đang được','cập nhật']:['Đang tải','quà tặng...'];x.fillText(t[0],320,308);x.fillText(t[1],320,348);return}
for(var i=0;i<m;i++){var p=SL[i];x.beginPath();x.moveTo(320,320);x.arc(320,320,312,-Math.PI/2+i*a,-Math.PI/2+(i+1)*a);x.closePath();x.fillStyle=COL[i%2];x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke();x.save();x.translate(320,320);x.rotate(-Math.PI/2+(i+.5)*a);var im=IM[p.ten];if(im&&im.complete&&im.naturalWidth){var s=Math.min(92,2*Math.PI*135/m*.8),r=Math.min(s/im.naturalWidth,s/im.naturalHeight);x.save();x.translate(135,0);x.rotate(Math.PI/2);x.beginPath();x.arc(0,0,s/2+5,0,7);x.fillStyle='rgba(255,255,255,.85)';x.shadowColor='rgba(0,0,0,.2)';x.shadowBlur=8;x.fill();x.shadowBlur=0;x.drawImage(im,-im.naturalWidth*r/2,-im.naturalHeight*r/2,im.naturalWidth*r,im.naturalHeight*r);x.restore()}
x.fillStyle=TX[i%2];x.font='700 22px '+FONT;x.textAlign='right';var L=two(p.ten);L.forEach(function(l,j){x.fillText(l.slice(0,12),300,(j-(L.length-1)/2)*24+7)});x.restore()}}
function nk(s){return String(s||'').normalize('NFC').replace(/\s+/g,' ').trim().toLowerCase()}
function pk(){var p=D&&D.prizes;if(!p)return[];if(p[ST])return p[ST];var k=nk(ST);for(var s in p)if(nk(s)==k)return p[s];return[]}
function build(){if(busy)return;P=pk();mk();draw()}
function apply(d){D=d;ready=true;var c=d.cfg||{},t=clean(c.TieuDe);if(t)$('tt').textContent=t;if(c.Logo)$('logo').src=c.Logo;if(c.Nen){document.body.classList.add('hasbg');document.body.style.background='linear-gradient(#0008,#0008),url("'+c.Nen+'") center/cover fixed'}$('mn').textContent=money(c.MinTien);var k=d.stores.join('|');if($('st').dataset.k!=k){$('st').innerHTML=d.stores.map(function(x){return'<option>'+esc(x)+'</option>'}).join('');$('st').dataset.k=k}if(d.stores.indexOf(ST)<0)ST=d.stores.indexOf(ls('st'))>=0?ls('st'):(d.stores[0]||'');$('st').value=ST;var im=d.imgs||{};for(var n in im)if(!IM[n]||IM[n]._d!=im[n]){var m=new Image();m._d=im[n];m.onload=draw;m.src=im[n];IM[n]=m}build();ui()}
function load(){var p=first&&window.PUBP?window.PUBP:api('pub');first=false;return p.then(function(d){ls('pub',JSON.stringify(d));apply(d);return d})}
function boot(n){load().catch(function(e){if(D)return;if(n<4)setTimeout(function(){boot(n+1)},2500);else $('er').textContent=(e&&e.message)||'Không tải được dữ liệu, vui lòng tải lại trang'})}
$('st').onchange=function(){ST=this.value;ls('st',ST);build()};
snow();mu();if(CFG.LOGO)$('logo').src=CFG.LOGO;else $('logo').style.display='none';rim();draw();ui();
try{var c0=ls('pub');if(c0)apply(JSON.parse(c0))}catch(e){}
boot(0);arm();tryPlay();
$('gate').onclick=function(){mute=false;ls('mute','0');aud();bg.muted=sa.muted=false;mu();var p=bg.play();if(p&&p.catch)p.catch(function(){});this.remove()};
$('ph').oninput=function(){this.value=this.value.replace(/[^0-9]/g,'')};
$('nm').onkeydown=function(e){if(e.key=='Enter'){e.preventDefault();$('ph').focus()}};
$('ph').onkeydown=function(e){if(e.key=='Enter'){e.preventDefault();$('hd').focus()}};

function chk(){var ph=$('ph').value.replace(/[^0-9]/g,'');return !$('nm').value.trim()?'Vui lòng nhập họ tên':!/^0[0-9]{9}$/.test(ph)?'Số điện thoại không hợp lệ (10 số, bắt đầu bằng 0)':!$('hd').value.trim()?'Vui lòng nhập số hóa đơn':''}
function paint(){$('wh').style.transform='rotate('+ang+'deg) translateZ(0)';if(SL.length){var ix=Math.floor((((ang%360)+360)%360)/(360/SL.length));if(ix!=lastIx){lastIx=ix;if(mode)tick()}}}
function spin0(){var t0=performance.now(),last=t0;mode='w';(function f(now){if(mode!='w')return;var dt=(now-last)/1000;last=now;vel=Math.min(1,(now-t0)/350)*840;ang=(ang+vel*dt)%360;paint();requestAnimationFrame(f)})(t0)}
function land(ix,r){var sg=360/SL.length,tg=((-(ix+.5)*sg+(Math.random()-.5)*sg*.7)%360+360)%360,T=3200,d0=vel*T/3000,d=((tg-ang%360)%360+360)%360;while(d<d0*.9)d+=360;var a0=ang,t0=performance.now();mode='l';(function f(now){var p=Math.min(1,(now-t0)/T);ang=a0+d*(1-Math.pow(1-p,3));paint();if(p<1)requestAnimationFrame(f);else fin(r)})(t0)}
function fin(r){mode='';if(sa)sa.pause();if(bg)bg.volume=.35;document.body.classList.remove('spinning');[523,659,784,1047].forEach(function(f,k){setTimeout(function(){beep(f,.45)},k*170)});$('rn').textContent=$('nm').value;$('rp').textContent=r.ten;var im=IM[r.ten];$('ri').hidden=!im;if(im)$('ri').src=im._d;$('rs').hidden=false}
function stop(msg){mode='';busy=0;if(sa)sa.pause();if(bg)bg.volume=.35;document.body.classList.remove('spinning');ui();$('er').textContent=msg;if(/hết quà/.test(msg))load().catch(function(){})}
$('cl').onclick=function(){$('rs').hidden=true;busy=0;ui();$('hd').value='';$('er').textContent='';load().catch(function(){})};
function start(){busy=1;$('sp').disabled=true;$('sp').textContent='Đang quay…';document.body.classList.add('spinning');aud();if(!mute){sa.currentTime=0;play(sa);bg.volume=.12;if(bg.paused)play(bg)}spin0();
api('spin',{store:ST,ten:$('nm').value,sdt:$('ph').value,hd:$('hd').value}).then(function(r){var ix=[];function f(){ix=[];SL.forEach(function(p,i){if(p.id==r.id)ix.push(i)})}f();if(!ix.length){P.push({id:r.id,ten:r.ten});mk();draw();f()}land(ix[Math.floor(Math.random()*ix.length)],r)}).catch(function(e){stop(e.message)})}
function go(){if(busy||!ready)return;var e=chk();$('er').textContent=e;if(e)return;if(P.length)return start();busy=1;$('sp').disabled=true;$('sp').textContent='Đang kiểm tra quà…';load().catch(function(){}).then(function(){busy=0;build();if(!P.length){ui();$('er').textContent='Cửa hàng này hiện chưa có quà, vui lòng hỏi nhân viên';return}start()})}
