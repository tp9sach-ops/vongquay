<!DOCTYPE html><html lang='vi'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#0d4a36'><title>Vòng Quay Giáng Sinh – 9 Sạch</title><link rel='preconnect' href='https://fonts.googleapis.com'><link rel='preconnect' href='https://fonts.gstatic.com' crossorigin><link rel='preload' as='style' href='https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mountains+of+Christmas:wght@700&display=swap' onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mountains+of+Christmas:wght@700&display=swap'></noscript><link rel='stylesheet' href='style.css'></head><body><div class='garland'></div><div class='lights'></div><i class='st s1'>✦</i><i class='st s2'>✦</i><i class='st s3'>✧</i><i class='st s4'>✦</i><button id='mute' class='mute' aria-label='Bật tắt âm thanh'>🔊</button><main class='wrap'><img id='logo' class='logo' alt='9 Sạch'><div class='xmas'>Merry XMAS</div><div id='tt' class='sub'>VÒNG QUAY MAY MẮN</div><p class='sub2'>Hóa đơn từ <b id='mn'>199.000</b>đ được quay 1 lần</p><div class='wheelbox'><svg class='bow' viewBox='0 0 120 60'><path d='M60 34C40 4 8 4 8 24s30 18 52 10z' fill='#d8132f'/><path d='M60 34C80 4 112 4 112 24s-30 18-52 10z' fill='#d8132f'/><path d='M60 34c-12 6-26 20-30 26l14-4zM60 34c12 6 26 20 30 26l-14-4z' fill='#a30d22'/><circle cx='60' cy='30' r='9' fill='#ef2a45'/></svg><canvas id='rim' width='720' height='720'></canvas><canvas id='wh' width='640' height='640'></canvas><svg class='pin' viewBox='0 0 34 44'><path d='M17 44C8 30 0 24 0 15a17 17 0 0134 0c0 9-8 15-17 29z' fill='#ff7a00' stroke='#fff' stroke-width='2'/><circle cx='17' cy='15' r='6' fill='#fff'/></svg><button id='ctr' type='button'>QUAY</button><span class='orn o1'>🎅</span><span class='orn o2'>⛄</span><span class='orn o3'>⭐</span><span class='orn o4'>🔔</span><span class='orn o5'>🍬</span><span class='orn o6'>🎁</span></div><div class='card'><label for='st'>Cửa hàng</label><select id='st'></select><label for='nm'>Họ tên</label><input id='nm' autocomplete='name' enterkeyhint='next'><label for='ph'>Số điện thoại</label><input id='ph' type='tel' inputmode='numeric' maxlength='11' autocomplete='tel' enterkeyhint='next'><label for='hd'>Số hóa đơn</label><input id='hd' enterkeyhint='go' autocomplete='off'><button id='sp' class='btn' type='button'>🎁 QUAY NGAY</button><p id='er' class='err'></p></div></main><div id='rs' class='modal' hidden><div class='box'><div class='big'>🎉</div><h2>Chúc mừng <span id='rn'></span>!</h2><img id='ri' hidden alt=''><p>Bạn đã trúng</p><h1 id='rp'></h1><p>Vui lòng đưa màn hình này cho nhân viên để nhận quà. Merry Christmas! 🎅</p><button id='cl' class='btn' type='button'>Đóng</button></div></div><script src='app.js'></script><script>
var $=function(i){return document.getElementById(i)},D=null,P=[],SL=[],IM={},ST='',ang=0,vel=0,mode='',busy=0,lastIx=-1,lastTk=0,bg=null,sa=null,mute=ls('mute')=='1',COL=['#c9d7f5','#fff1dc'];
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}}
function aud(){if(bg)return;bg=new Audio('nhac-nen.mp3');sa=new Audio('tieng-quay.mp3');bg.loop=sa.loop=true;bg.volume=.35;sa.volume=.9;bg.preload=sa.preload='auto';bg.muted=sa.muted=mute}
function ac(){var A=window.AC=window.AC||new(window.AudioContext||window.webkitAudioContext)();if(A.state=='suspended')A.resume();return A}
function beep(f,d,v,ty){if(mute)return;try{var A=ac(),o=A.createOscillator(),g=A.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.value=v||.12;g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d)}catch(e){}}
function tick(){var n=performance.now();if(n-lastTk<55)return;lastTk=n;beep(1500,.03,.035,'square')}
function play(a){if(a&&!mute)a.play().catch(function(){})}
function snow(){var f=document.createDocumentFragment(),n=innerWidth<500?14:22;for(var i=0;i<n;i++){var s=document.createElement('i');s.className='sn';s.textContent='❄';s.style.cssText='left:'+Math.random()*100+'vw;animation-duration:'+(7+Math.random()*8)+'s;animation-delay:-'+Math.random()*10+'s;font-size:'+(10+Math.random()*14)+'px';f.appendChild(s)}document.body.appendChild(f)}
snow();$('mute').textContent=mute?'🔇':'🔊';$('logo').src=CFG.LOGO;
document.addEventListener('pointerdown',function f(){document.removeEventListener('pointerdown',f);aud();play(bg)});
document.addEventListener('visibilitychange',function(){if(!bg)return;if(document.hidden){bg.pause();sa.pause()}else{play(bg);if(mode)play(sa)}});
$('mute').onclick=function(){mute=!mute;ls('mute',mute?'1':'0');aud();bg.muted=sa.muted=mute;this.textContent=mute?'🔇':'🔊';if(!mute)play(bg)};
function rim(){var x=$('rim').getContext('2d'),g=x.createRadialGradient(360,360,300,360,360,360);g.addColorStop(0,'#ffb347');g.addColorStop(.6,'#ff8a1f');g.addColorStop(1,'#d9550a');x.beginPath();x.arc(360,360,358,0,7);x.fillStyle=g;x.fill();x.beginPath();x.arc(360,360,322,0,7);x.fillStyle='#8a3a06';x.fill();x.beginPath();x.arc(360,360,330,0,7);x.strokeStyle='#ffe08a';x.lineWidth=3;x.stroke();for(var i=0;i<24;i++){var t=i*Math.PI/12;x.beginPath();x.arc(360+342*Math.cos(t),360+342*Math.sin(t),9,0,7);x.fillStyle=i%2?'#fff3a0':'#ffffff';x.shadowColor='#fff3a0';x.shadowBlur=14;x.fill()}}
function two(s){s=String(s);if(s.length<=11)return[s];var m=s.length>>1,b=-1,i;for(i=0;i<s.length;i++)if(s[i]==' '&&(b<0||Math.abs(i-m)<Math.abs(b-m)))b=i;return b<0?[s.slice(0,11),s.slice(11,22)]:[s.slice(0,b),s.slice(b+1)]}
function mk(){var n=P.length,k,i;SL=[];if(!n)return;k=Math.ceil(8/n);while((n*k)%2)k++;for(i=0;i<n*k;i++)SL.push(P[i%n])}
function draw(){var x=$('wh').getContext('2d'),m=SL.length,a=2*Math.PI/(m||1);x.clearRect(0,0,640,640);if(!m){for(var e=0;e<8;e++){x.beginPath();x.moveTo(320,320);x.arc(320,320,312,-Math.PI/2+e*Math.PI/4,-Math.PI/2+(e+1)*Math.PI/4);x.closePath();x.fillStyle=COL[e%2];x.fill();x.strokeStyle='#f0c15a';x.lineWidth=3;x.stroke()}x.beginPath();x.arc(320,320,170,0,7);x.fillStyle='#ffffffee';x.fill();x.fillStyle='#8e0b22';x.font='bold 30px Baloo 2,sans-serif';x.textAlign='center';x.fillText('Quà đang được',320,300);x.fillText('cập nhật',320,340);x.font='54px sans-serif';x.fillText('🎁',320,260);return}
for(var i=0;i<m;i++){var p=SL[i];x.beginPath();x.moveTo(320,320);x.arc(320,320,312,-Math.PI/2+i*a,-Math.PI/2+(i+1)*a);x.closePath();x.fillStyle=COL[i%2];x.fill();x.strokeStyle='#f0c15a';x.lineWidth=3;x.stroke();x.save();x.translate(320,320);x.rotate(-Math.PI/2+(i+.5)*a);var im=IM[p.ten];if(im&&im.complete&&im.naturalWidth){var s=Math.min(92,2*Math.PI*135/m*.8),r=Math.min(s/im.naturalWidth,s/im.naturalHeight);x.save();x.translate(135,0);x.rotate(Math.PI/2);x.beginPath();x.arc(0,0,s/2+5,0,7);x.fillStyle='#ffffffcc';x.shadowColor='#0003';x.shadowBlur=8;x.fill();x.shadowBlur=0;x.drawImage(im,-im.naturalWidth*r/2,-im.naturalHeight*r/2,im.naturalWidth*r,im.naturalHeight*r);x.restore()}
x.fillStyle=i%2?'#8e0b22':'#14307a';x.font='bold 22px Baloo 2,sans-serif';x.textAlign='right';var L=two(p.ten);L.forEach(function(l,j){x.fillText(l.slice(0,12),300,(j-(L.length-1)/2)*24+7)});x.restore()}}
function nk(s){return String(s||'').normalize('NFC').replace(/\s+/g,' ').trim().toLowerCase()}
function pk(){var p=D&&D.prizes;if(!p)return[];if(p[ST])return p[ST];var k=nk(ST);for(var s in p)if(nk(s)==k)return p[s];return[]}
function build(){if(busy)return;P=pk();mk();draw()}
function apply(d){D=d;var c=d.cfg||{};if(c.TieuDe)$('tt').textContent=c.TieuDe;if(c.Logo)$('logo').src=c.Logo;if(c.Nen)document.body.style.background='linear-gradient(#0006,#0006),url('+c.Nen+') center/cover fixed';$('mn').textContent=money(c.MinTien);var k=d.stores.join('|');if($('st').dataset.k!=k){$('st').innerHTML=d.stores.map(function(x){return'<option>'+esc(x)+'</option>'}).join('');$('st').dataset.k=k}if(d.stores.indexOf(ST)<0)ST=d.stores.indexOf(ls('st'))>=0?ls('st'):(d.stores[0]||'');$('st').value=ST;var im=d.imgs||{};for(var n in im)if(!IM[n]||IM[n]._d!=im[n]){var m=new Image();m._d=im[n];m.onload=draw;m.src=im[n];IM[n]=m}build()}
function load(){return api('pub').then(function(d){ls('pub',JSON.stringify(d));apply(d)})}
$('st').onchange=function(){ST=this.value;ls('st',ST);build()};
rim();draw();try{var c0=ls('pub');if(c0)apply(JSON.parse(c0))}catch(e){}
load().catch(function(e){if(!D)$('er').textContent=e.message});
$('ph').oninput=function(){this.value=this.value.replace(/[^0-9]/g,'')};
$('nm').onkeydown=function(e){if(e.key=='Enter'){e.preventDefault();$('ph').focus()}};
$('ph').onkeydown=function(e){if(e.key=='Enter'){e.preventDefault();$('hd').focus()}};
$('hd').onkeydown=function(e){if(e.key=='Enter'){e.preventDefault();this.blur();go()}};
$('ctr').onclick=$('sp').onclick=go;
function chk(){var ph=$('ph').value.replace(/[^0-9]/g,'');return !$('nm').value.trim()?'Vui lòng nhập họ tên':!/^0[0-9]{9}$/.test(ph)?'Số điện thoại không hợp lệ (10 số, bắt đầu bằng 0)':!$('hd').value.trim()?'Vui lòng nhập số hóa đơn':!P.length?'Cửa hàng này tạm hết quà, vui lòng hỏi nhân viên':''}
function paint(){$('wh').style.transform='rotate('+ang+'deg) translateZ(0)';if(SL.length){var ix=Math.floor((((ang%360)+360)%360)/(360/SL.length));if(ix!=lastIx){lastIx=ix;if(mode)tick()}}}
function spin0(){var t0=performance.now(),last=t0;mode='w';(function f(now){if(mode!='w')return;var dt=(now-last)/1000;last=now;vel=Math.min(1,(now-t0)/350)*840;ang=(ang+vel*dt)%360;paint();requestAnimationFrame(f)})(t0)}
function land(ix,r){var sg=360/SL.length,tg=((-(ix+.5)*sg+(Math.random()-.5)*sg*.7)%360+360)%360,T=3200,d0=vel*T/3000,d=((tg-ang%360)%360+360)%360;while(d<d0*.9)d+=360;var a0=ang,t0=performance.now();mode='l';(function f(now){var p=Math.min(1,(now-t0)/T);ang=a0+d*(1-Math.pow(1-p,3));paint();if(p<1)requestAnimationFrame(f);else fin(r)})(t0)}
function fin(r){mode='';if(sa)sa.pause();if(bg)bg.volume=.35;document.body.classList.remove('spinning');[523,659,784,1047].forEach(function(f,k){setTimeout(function(){beep(f,.45)},k*170)});$('rn').textContent=$('nm').value;$('rp').textContent=r.ten;var im=IM[r.ten];$('ri').hidden=!im;if(im)$('ri').src=im._d;$('rs').hidden=false}
function stop(msg){mode='';busy=0;if(sa)sa.pause();if(bg)bg.volume=.35;document.body.classList.remove('spinning');$('sp').disabled=false;$('sp').textContent='🎁 QUAY NGAY';$('er').textContent=msg}
$('cl').onclick=function(){$('rs').hidden=true;busy=0;$('sp').disabled=false;$('sp').textContent='🎁 QUAY NGAY';$('hd').value='';$('er').textContent='';load().catch(function(){})};
function go(){if(busy)return;var e=chk();$('er').textContent=e;if(e)return;busy=1;$('sp').disabled=true;$('sp').textContent='⏳ Đang quay...';document.body.classList.add('spinning');aud();if(!mute){sa.currentTime=0;play(sa);bg.volume=.12}spin0();
api('spin',{store:ST,ten:$('nm').value,sdt:$('ph').value,hd:$('hd').value}).then(function(r){var ix=[];function f(){ix=[];SL.forEach(function(p,i){if(p.id==r.id)ix.push(i)})}f();if(!ix.length){P.push({id:r.id,ten:r.ten});mk();draw();f()}land(ix[Math.floor(Math.random()*ix.length)],r)}).catch(function(e){stop(e.message)})}
</script></body></html>
