<!DOCTYPE html><html lang='vi'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Vòng Quay Giáng Sinh – 9 Sạch</title><link rel='stylesheet' href='style.css'></head><body><button id='mute' class='mute'>🔊</button><main class='wrap'><img id='logo' class='logo' alt='9 Sạch'><h1 id='tt'>🎄 Vòng Quay Giáng Sinh 🎅</h1><p class='sub'>Hóa đơn từ <b id='mn'>199.000</b>đ được quay 1 lần</p><section id='s1' class='card'><label>Cửa hàng</label><select id='st'></select><label>Họ tên</label><input id='nm' autocomplete='name'><label>Số điện thoại</label><input id='ph' type='tel' inputmode='numeric' maxlength='11'><label>Số hóa đơn</label><input id='hd'><button id='go' class='btn'>🎁 VÀO QUAY THƯỞNG</button><p id='er' class='err'></p></section><section id='s2' hidden><div class='wh'><div class='ptr'>▼</div><canvas id='wh' width='600' height='600'></canvas></div><button id='sp' class='btn'>🎄 QUAY NGAY 🎄</button><p id='er2' class='err'></p></section></main><div id='rs' class='modal' hidden><div class='box'><div class='big'>🎉</div><h2>Chúc mừng <span id='rn'></span>!</h2><p>Bạn đã trúng</p><h1 id='rp'></h1><p>Vui lòng đưa màn hình này cho nhân viên để nhận quà. Merry Christmas! 🎅</p><button class='btn' onclick='location.reload()'>Đóng</button></div></div><script src='app.js'></script><script>var $=i=>document.getElementById(i),P=[],ST='',rot=0,busy=0,mute=0,AC;snow();$('logo').src=CFG.LOGO;$('mute').onclick=function(){mute=!mute;this.textContent=mute?'🔇':'🔊'};function beep(f,d,t){if(mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=.08;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}var COL=['#c8102e','#0b6b3a','#ffc72c','#ffffff','#8e0b22','#14894d'];function draw(){var c=$('wh'),x=c.getContext('2d'),n=P.length||1,a=2*Math.PI/n;x.clearRect(0,0,600,600);for(var i=0;i<n;i++){var k=COL[i%6];x.beginPath();x.moveTo(300,300);x.arc(300,300,290,-Math.PI/2+i*a,-Math.PI/2+(i+1)*a);x.fillStyle=k;x.fill();x.strokeStyle='#ffc72c';x.lineWidth=4;x.stroke();x.save();x.translate(300,300);x.rotate(-Math.PI/2+(i+.5)*a);x.textAlign='right';x.fillStyle=(k=='#ffc72c'||k=='#ffffff')?'#7a0a1c':'#fff';x.font='bold 28px sans-serif';x.fillText((P[i]?P[i].ten:'').slice(0,16),270,10);x.restore()}x.beginPath();x.arc(300,300,40,0,7);x.fillStyle='#ffc72c';x.fill();x.font='36px sans-serif';x.textAlign='center';x.fillText('🎁',300,314)}async function load(s){var r=await api('pub',{store:s});if(r.cfg.TieuDe)$('tt').textContent=r.cfg.TieuDe;if(r.cfg.Logo)$('logo').src=r.cfg.Logo;if(r.cfg.Nen)document.body.style.background='linear-gradient(#0007,#0007),url('+r.cfg.Nen+') center/cover fixed';$('mn').textContent=money(r.cfg.MinTien);if(!s)$('st').innerHTML=r.stores.map(x=>'<option>'+esc(x)+'</option>').join('');ST=r.store;$('st').value=ST;P=r.prizes}$('st').onchange=()=>{$('er').textContent='⏳ Đang tải quà của cửa hàng...';load($('st').value).then(()=>$('er').textContent='').catch(e=>$('er').textContent=e.message)};load('').catch(e=>$('er').textContent=e.message);$('go').onclick=()=>{var e='',ph=$('ph').value.replace(/[^0-9]/g,'');if(!$('nm').value.trim())e='Vui lòng nhập họ tên';else if(!/^0[0-9]{9}$/.test(ph))e='Số điện thoại không hợp lệ (10 số, bắt đầu bằng 0)';else if(!$('hd').value.trim())e='Vui lòng nhập số hóa đơn';else if(!P.length)e='Cửa hàng này đã hết quà';$('er').textContent=e;if(e)return;$('s1').hidden=true;$('s2').hidden=false;draw()};$('sp').onclick=async()=>{if(busy)return;busy=1;$('er2').textContent='';$('sp').textContent='⏳ Đang quay...';try{var r=await api('spin',{store:ST,ten:$('nm').value,sdt:$('ph').value,hd:$('hd').value});var i=P.findIndex(p=>p.id==r.id);if(i<0){P.push({id:r.id,ten:r.ten});i=P.length-1;draw()}var n=P.length,sg=360/n,b=((-(i+.5)*sg+(Math.random()-.5)*sg*.7)%360+360)%360,c=$('wh');rot+=360*6+((b-rot%360+360)%360);c.style.transition='transform 5.5s cubic-bezier(.12,.7,.15,1)';c.style.transform='rotate('+rot+'deg)';var t=setInterval(()=>beep(700+Math.random()*300,.05,'square'),140);setTimeout(()=>{clearInterval(t);[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.4),k*160));$('rn').textContent=$('nm').value;$('rp').textContent=r.ten;$('rs').hidden=false;snow()},5800)}catch(e){busy=0;$('sp').textContent='🎄 QUAY NGAY 🎄';$('s2').hidden=true;$('s1').hidden=false;$('er').textContent=e.message}};</script></body></html>
