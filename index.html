<!DOCTYPE html><html lang='vi'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Vòng Quay Giáng Sinh – 9 Sạch</title><link rel='preconnect' href='https://fonts.googleapis.com'><link href='https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mountains+of+Christmas:wght@700&display=swap' rel='stylesheet'><link rel='stylesheet' href='style.css'></head><body><div class='lights'></div><button id='mute' class='mute'>🔊</button><main class='wrap'><img id='logo' class='logo' alt='9 Sạch'><div class='xmas'>Merry XMAS</div><div id='tt' class='sub'>VÒNG QUAY MAY MẮN</div><p class='sub2'>Hóa đơn từ <b id='mn'>199.000</b>đ được quay 1 lần</p><div class='wheelbox'><svg class='bow' viewBox='0 0 120 60'><path d='M60 34C40 4 8 4 8 24s30 18 52 10z' fill='#d8132f'/><path d='M60 34C80 4 112 4 112 24s-30 18-52 10z' fill='#d8132f'/><path d='M60 34c-12 6-26 20-30 26l14-4zM60 34c12 6 26 20 30 26l-14-4z' fill='#a30d22'/><circle cx='60' cy='30' r='9' fill='#ef2a45'/></svg><canvas id='rim' width='720' height='720'></canvas><canvas id='wh' width='640' height='640'></canvas><svg class='pin' viewBox='0 0 34 44'><path d='M17 44C8 30 0 24 0 15a17 17 0 0134 0c0 9-8 15-17 29z' fill='#ff7a00' stroke='#fff' stroke-width='2'/><circle cx='17' cy='15' r='6' fill='#fff'/></svg><button id='ctr' onclick='go()'>QUAY</button></div><div class='card'><label>Cửa hàng</label><select id='st'></select><label>Họ tên</label><input id='nm' autocomplete='name'><label>Số điện thoại</label><input id='ph' type='tel' inputmode='numeric' maxlength='11'><label>Số hóa đơn</label><input id='hd'><button id='sp' class='btn' onclick='go()'>🎁 QUAY NGAY</button><p id='er' class='err'></p></div><div class='deco'><span>🎅</span><span>⛄</span></div></main><div id='rs' class='modal' hidden><div class='box'><div class='big'>🎉</div><h2>Chúc mừng <span id='rn'></span>!</h2><img id='ri' hidden alt=''><p>Bạn đã trúng</p><h1 id='rp'></h1><p>Vui lòng đưa màn hình này cho nhân viên để nhận quà. Merry Christmas! 🎅</p><button class='btn' onclick='location.reload()'>Đóng</button></div></div><script src='app.js'></script><script>var $=i=>document.getElementById(i),D=null,P=[],SL=[],IM={},ST='',ang=0,vel=0,mode='',busy=0,mute=0,COL=['#fff4dc','#ffe3b8','#ffd5d5'];var bg=new Audio('vincemcgill-santa-claus-614837.mp3'),sa=new Audio('freesound_community-spinning-reel-27903.mp3');bg.loop=true;sa.loop=true;bg.volume=.35;sa.volume=.9;function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}}function beep(f,d){if(mute)return;try{var A=window.AC=window.AC||new (window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.value=.12;g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d)}catch(e){}}snow();$('logo').src=CFG.LOGO;document.addEventListener('pointerdown',function f(){document.removeEventListener('pointerdown',f);if(!mute)bg.play().catch(function(){})});$('mute').onclick=function(){mute=!mute;bg.muted=mute;sa.muted=mute;this.textContent=mute?'🔇':'🔊';if(!mute)bg.play().catch(function(){})};function rim(){var x=$('rim').getContext('2d'),g=x.createRadialGradient(360,360,300,360,360,360);g.addColorStop(0,'#ffb347');g.addColorStop(.6,'#ff8a1f');g.addColorStop(1,'#d9550a');x.beginPath();x.arc(360,360,358,0,7);x.fillStyle=g;x.fill();x.beginPath();x.arc(360,360,322,0,7);x.fillStyle='#7a3004';x.fill();for(var i=0;i<24;i++){var t=i*Math.PI/12;x.beginPath();x.arc(360+340*Math.cos(t),360+340*Math.sin(t),9,0,7);x.fillStyle=i%2?'#fff3a0':'#ffffff';x.shadowColor='#fff3a0';x.shadowBlur=14;x.fill()}}function two(s){s=String(s);if(s.length<=11)return[s];var m=s.length>>1,b=-1,i;for(i=0;i<s.length;i++)if(s[i]==' '&&(b<0||Math.abs(i-m)<Math.abs(b-m)))b=i;return b<0?[s.slice(0,11),s.slice(11,22)]:[s.slice(0,b),s.slice(b+1)]}function draw(){var x=$('wh').getContext('2d'),m=SL.length,a=2*Math.PI/(m||1);x.clearRect(0,0,640,640);if(!m){x.beginPath();x.arc(320,320,312,0,7);x.fillStyle='#ddd';x.fill();x.fillStyle='#8e0b22';x.font='bold 40px sans-serif';x.textAlign='center';x.fillText('Hết quà',320,332);return}for(var i=0;i<m;i++){var p=SL[i];x.beginPath();x.moveTo(320,320);x.arc(320,320,312,-Math.PI/2+i*a,-Math.PI/2+(i+1)*a);x.closePath();x.fillStyle=COL[i%3];x.fill();x.strokeStyle='#e8a33d';x.lineWidth=2;x.stroke();x.save();x.translate(320,320);x.rotate(-Math.PI/2+(i+.5)*a);var im=IM[p.ten];if(im&&im.complete&&im.naturalWidth){var s=Math.min(86,2*Math.PI*125/m*.85),r=Math.min(s/im.naturalWidth,s/im.naturalHeight);x.save();x.translate(125,0);x.rotate(Math.PI/2);x.drawImage(im,-im.naturalWidth*r/2,-im.naturalHeight*r/2,im.naturalWidth*r,im.naturalHeight*r);x.restore()}x.fillStyle='#8e0b22';x.font='bold 22px Baloo 2,sans-serif';x.textAlign='right';var L=two(p.ten);L.forEach(function(l,j){x.fillText(l.slice(0,12),300,(j-(L.length-1)/2)*24+7)});x.restore()}}function build(){if(busy)return;P=(D&&D.prizes[ST])||[];var n=P.length,m=n?n*Math.ceil(8/n):0;SL=[];for(var k=0;k<m;k++)SL.push(P[k%n]);draw()}function apply(d){D=d;var c=d.cfg||{};if(c.TieuDe)$('tt').textContent=c.TieuDe;if(c.Logo)$('logo').src=c.Logo;if(c.Nen)document.body.style.background='linear-gradient(#0006,#0006),url('+c.Nen+') center/cover fixed';$('mn').textContent=money(c.MinTien);var k=d.stores.join('|');if($('st').dataset.k!=k){$('st').innerHTML=d.stores.map(x=>'<option>'+esc(x)+'</option>').join('');$('st').dataset.k=k}if(d.stores.indexOf(ST)<0)ST=d.stores.indexOf(ls('st'))>=0?ls('st'):(d.stores[0]||'');$('st').value=ST;var im=d.imgs||{};for(var n in im)if(!IM[n]||IM[n]._d!=im[n]){var m=new Image();m._d=im[n];m.onload=draw;m.src=im[n];IM[n]=m}build()}$('st').onchange=function(){ST=this.value;ls('st',ST);build()};rim();draw();try{var c0=ls('pub');if(c0)apply(JSON.parse(c0))}catch(e){}api('pub').then(function(d){ls('pub',JSON.stringify(d));apply(d)}).catch(function(e){if(!D)$('er').textContent=e.message});function chk(){var ph=$('ph').value.replace(/[^0-9]/g,'');return !$('nm').value.trim()?'Vui lòng nhập họ tên':!/^0[0-9]{9}$/.test(ph)?'Số điện thoại không hợp lệ (10 số, bắt đầu bằng 0)':!$('hd').value.trim()?'Vui lòng nhập số hóa đơn':!P.length?'Cửa hàng này đã hết quà':''}function paint(){$('wh').style.transform='rotate('+ang+'deg)'}function spin0(){var t0=performance.now(),last=t0;mode='w';(function f(now){if(mode!='w')return;var dt=(now-last)/1000;last=now;vel=Math.min(1,(now-t0)/600)*900;ang=(ang+vel*dt)%360;paint();requestAnimationFrame(f)})(t0)}function land(ix,r){var sg=360/SL.length,tg=((-(ix+.5)*sg+(Math.random()-.5)*sg*.7)%360+360)%360,T=4200,d0=vel*T/3000,d=((tg-ang%360)%360+360)%360;while(d<d0*.9)d+=360;var a0=ang,t0=performance.now();mode='l';(function f(now){var p=Math.min(1,(now-t0)/T);ang=a0+d*(1-Math.pow(1-p,3));paint();if(p<1)requestAnimationFrame(f);else fin(r)})(t0)}function fin(r){sa.pause();bg.volume=.35;[523,659,784,1047].forEach(function(f,k){setTimeout(function(){beep(f,.45)},k*170)});$('rn').textContent=$('nm').value;$('rp').textContent=r.ten;var im=IM[r.ten];$('ri').hidden=!im;if(im)$('ri').src=im._d;$('rs').hidden=false;snow()}function go(){if(busy)return;var e=chk();$('er').textContent=e;if(e)return;busy=1;$('sp').textContent='⏳ Đang quay...';if(!mute){sa.currentTime=0;sa.play().catch(function(){});bg.volume=.12}spin0();api('spin',{store:ST,ten:$('nm').value,sdt:$('ph').value,hd:$('hd').value}).then(function(r){var ix=[];SL.forEach(function(p,i){if(p.id==r.id)ix.push(i)});if(!ix.length){P.push({id:r.id,ten:r.ten});var n=P.length,m=n*Math.ceil(8/n);SL=[];for(var k=0;k<m;k++)SL.push(P[k%n]);draw();SL.forEach(function(p,i){if(p.id==r.id)ix.push(i)})}land(ix[Math.floor(Math.random()*ix.length)],r)}).catch(function(e){mode='';busy=0;sa.pause();bg.volume=.35;$('sp').textContent='🎁 QUAY NGAY';$('er').textContent=e.message})}</script></body></html>
