<!DOCTYPE html><html lang='vi'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Quản lý – Vòng Quay 9 Sạch</title><link href='https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap' rel='stylesheet'><link rel='stylesheet' href='style.css'><script src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'></script></head><body><div class='lights'></div><main class='wrap' style='max-width:900px'><img class='logo' id='logo' alt='9 Sạch'><h1>🎄 Quản lý vòng quay</h1><div id='lg' class='card light'><label>Số điện thoại</label><input id='sd' type='tel'><label>Họ tên</label><input id='tn'><button class='btn' onclick='login()'>ĐĂNG NHẬP</button><p id='er' class='err'></p></div><div id='ad' hidden><div class='bar'><b id='who'></b><button class='sm' onclick='out()'>Thoát</button></div><nav class='tabs'><button data-t='h'>📋 Lịch sử quay</button><button data-t='g' class='m'>🎁 Quà tặng</button><button data-t='i' class='m'>🖼️ Ảnh sản phẩm</button><button data-t='c' class='m'>🏬 Cửa hàng</button><button data-t='s' class='m'>⚙️ Cài đặt & QR</button></nav><div id='v' class='card light'></div></div></main><script src='app.js'></script><script>var $=i=>document.getElementById(i),AU=null,U=null,H=null,AD=null,GS='',T='h',NM=[],HT=0,FS='',FD='',FQ='',AL=0,LT=0;if(typeof CFG!=='undefined'&&CFG.LOGO)$('logo').src=CFG.LOGO;else $('logo').style.display='none';async function call(a,d){var body=JSON.stringify(Object.assign({a:a,au:AU},d||{})),n=(a=='login'||a=='hist'||a=='adminAll')?2:1,err;for(var k=0;k<n;k++){var ac=new AbortController(),tm=setTimeout(function(){ac.abort()},30000);try{var r=await fetch(CFG.API,{method:'POST',body:body,signal:ac.signal});var j=await r.json();clearTimeout(tm);if(!j.ok){var se=new Error(j.m);se.srv=1;throw se}return j.d}catch(e){clearTimeout(tm);if(e.srv)throw e;err=new Error('Máy chủ phản hồi quá chậm hoặc mất kết nối, bấm Thử lại')}}throw err}function ld(){var t0=Date.now();clearInterval(LT);$('v').innerHTML='<p>⏳ Đang tải... <span id=lt></span></p>';LT=setInterval(function(){var s=$('lt');if(!s){clearInterval(LT);return}s.textContent=Math.round((Date.now()-t0)/1000)+' giây'},1000)}function er(e){clearInterval(LT);$('v').innerHTML='<p class=err>'+esc(e.message)+'</p><button class=sm data-a="retry">🔄 Thử lại</button>'}function retry(){if(T=='h'){H=null;ld();loadH()}else{AD=null;ld();loadA()}}async function login(){AU={sdt:$('sd').value,ten:$('tn').value};$('er').textContent='⏳ Đang đăng nhập...';try{U=await call('login');sessionStorage.au=JSON.stringify(AU);sessionStorage.u=JSON.stringify(U);start()}catch(e){$('er').textContent=e.message}}function start(){$('lg').hidden=true;$('ad').hidden=false;$('who').textContent=U.ten+(U.mgr?' (quản lý)':' (nhân viên)');document.querySelectorAll('.m').forEach(b=>b.hidden=!U.mgr);GS=U.stores[0]||'';try{if(!H&&sessionStorage.hc)H=JSON.parse(sessionStorage.hc)}catch(e){}tab('h')}function out(){sessionStorage.clear();location.reload()}if(sessionStorage.au){AU=JSON.parse(sessionStorage.au);try{U=JSON.parse(sessionStorage.u||'null')}catch(e){U=null}if(U){start();call('login').then(r=>{U=r;sessionStorage.u=JSON.stringify(U)}).catch(()=>{})}else call('login').then(r=>{U=r;sessionStorage.u=JSON.stringify(U);start()}).catch(()=>{})}async function loadH(){try{H=await call('hist');HT=Date.now();try{sessionStorage.hc=JSON.stringify(H)}catch(e){}if(T=='h')vH()}catch(e){if(T=='h'&&!H)er(e)}if(U&&U.mgr)ensureA()}function ensureA(){if(!AD&&!AL)loadA()}async function loadA(){AL=1;try{AD=await call('adminAll');if(T!='h')R()}catch(e){if(T!='h')er(e)}AL=0}function tab(t){T=t;R();if(t=='h'){if(Date.now()-HT>30000)loadH()}else if(U&&U.mgr)ensureA()}function R(){if(T=='h')vH();else if(!AD)ld();else({g:vG,c:vC,s:vS,i:vI})[T]()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));$('v').onclick=e=>{var b=e.target.closest('button[data-a]');if(b)window[b.dataset.a](b.dataset.i)};$('v').onchange=e=>{var f=e.target;if(f.type!='file')return;if(f.dataset.p)pimg(f.dataset.p,f.files[0]);else if(f.dataset.n)nimg(f.dataset.n,f.files[0]);else cimg(f.dataset.k,f.files[0],+f.dataset.w)};function shrink(f,w,mx,ok,bad){if(!f)return;var im=new Image();im.onload=function(){var s=Math.min(1,w/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));var x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);var q=.85,t='image/webp',v=c.toDataURL(t,q);if(v.indexOf('image/webp')<0){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);t='image/jpeg';v=c.toDataURL(t,q)}while(v.length>mx&&q>.2){q-=.1;v=c.toDataURL(t,q)}v.length>mx?bad():ok(v)};im.src=URL.createObjectURL(f)}function vH(){if(!H){ld();return}$('v').innerHTML=`<div style='display:grid;gap:6px'><select id='fs' onchange='FS=this.value;hr()'><option value=''>Tất cả cửa hàng</option>${U.stores.map(s=>`<option ${s==FS?'selected':''}>${esc(s)}</option>`).join('')}</select><input id='fd' type='date' value='${FD}' onchange='FD=this.value;hr()'><input id='fq' value='${esc(FQ)}' placeholder='Tìm số hóa đơn / SĐT / tên' oninput='FQ=this.value;hr()'><button class=sm data-a='loadH'>🔄 Làm mới</button></div><div id='ht' class='tbl'></div>`;hr()}function hr(){var q=FQ.trim().toLowerCase(),dd=FD?FD.split('-').reverse().join('/'):'';var L=H.filter(r=>(!FS||r.ch===FS)&&(!dd||r.t.indexOf(dd)==0)&&(!q||(r.hd+r.sdt+r.ten).toLowerCase().indexOf(q)>=0));$('ht').innerHTML='<p>'+L.length+' lượt quay</p><table><tr><th>Thời gian</th><th>Cửa hàng</th><th>Khách</th><th>Hóa đơn</th><th>Quà</th><th>Trạng thái</th></tr>'+L.map(r=>`<tr><td>${r.t}</td><td>${esc(r.ch)}</td><td>${esc(r.ten)}<br>${esc(r.sdt)}</td><td>${esc(r.hd)}</td><td><b>${esc(r.qua)}</b></td><td>${r.tt=='Đã trao'?`<span class=ok>Đã trao</span><br>${esc(r.ng)}`:`<button class=sm data-a='cf' data-i='${r.r}'>XÁC NHẬN ĐÃ TRAO</button>`}</td></tr>`).join('')+'</table>'}async function cf(r){var x=H.find(y=>y.r==r);if(!confirm('Đối chiếu hóa đơn '+x.hd+' - quà: '+x.qua+'. Xác nhận ĐÃ TRAO QUÀ?'))return;try{await call('confirm',{r:r,hd:x.hd});x.tt='Đã trao';x.ng=U.ten;try{sessionStorage.hc=JSON.stringify(H)}catch(e){}hr()}catch(e){alert(e.message)}}function vG(){var S=AD.stores.map(s=>s.ten);if(S.indexOf(GS)<0)GS=S[0]||'';var row=p=>{var im=AD.imgs[p.ten],n=p.id=='new';return `<tr><td>${!n&&im?`<img src='${im}' style='width:44px;height:44px;object-fit:contain;vertical-align:middle'> `:''}<input id='n${p.id}' value='${esc(p.ten)}'></td><td><input id='t${p.id}' type=number value='${p.tyle}' style='width:70px'></td><td><input id='q${p.id}' type=number value='${p.sl}' style='width:70px'></td><td><input id='b${p.id}' type=checkbox ${p.bat?'checked':''} style='width:24px'></td><td>${n?'':(p.sl<1?'<b>Hết</b> ':'')+`<label class=sm style='display:inline-block;margin:0'>📷 Ảnh<input type=file accept='image/*' data-p='${p.id}' hidden></label> `}<button id='s${p.id}' class=sm data-a='sp' data-i='${p.id}'>Lưu</button>${n?'':` <button class=sm data-a='dp' data-i='${p.id}'>Xóa</button>`}</td></tr>`};$('v').innerHTML=`<select onchange='GS=this.value;R()'>${S.map(s=>`<option ${s==GS?'selected':''}>${esc(s)}</option>`).join('')}</select><p>Tỷ lệ là trọng số, hệ thống tự chia lại cho đủ 100% theo các quà còn hàng. Quà hết số lượng tự tính 0%. Ảnh gắn theo TÊN quà (dùng chung cho các cửa hàng): đặt tên quà giống nhau thì dùng chung ảnh.</p><div class=tbl><table><tr><th>Tên quà</th><th>Tỷ lệ %</th><th>Số lượng</th><th>Bật</th><th></th></tr>${AD.prizes.filter(p=>p.store==GS).map(row).join('')}${row({id:'new',ten:'',tyle:10,sl:10,bat:true})}</table></div>`}async function sp(i){var b=$('s'+i);b.textContent='⏳';try{var r=await call('savePrize',{store:GS,id:i=='new'?'':i,ten:$('n'+i).value,tyle:$('t'+i).value,sl:$('q'+i).value,bat:$('b'+i).checked});var k=AD.prizes.findIndex(x=>x.id==r.id&&x.store==GS);if(k<0)AD.prizes.push(r);else AD.prizes[k]=r;R()}catch(e){b.textContent='Lưu';alert(e.message)}}async function dp(i){if(!confirm('Xóa quà này?'))return;try{await call('delPrize',{id:i,store:GS});AD.prizes=AD.prizes.filter(x=>!(x.id==i&&x.store==GS));R()}catch(e){alert(e.message)}}function pimg(id,f){var p=AD.prizes.find(x=>x.id==id&&x.store==GS);shrink(f,180,16000,async v=>{try{await call('saveImg',{ten:p.ten,v:v});AD.imgs[p.ten]=v;R()}catch(e){alert(e.message)}},()=>alert('Ảnh quá phức tạp, hãy chọn ảnh khác'))}function vI(){NM=Object.keys(AD.prizes.reduce(function(o,p){o[p.ten]=1;return o},{}));$('v').innerHTML=`<p>Bấm <b>Tải ảnh lên</b> ở từng sản phẩm. Nên chọn ảnh vuông, nền trắng hoặc nền trong suốt. Ảnh tự thu nhỏ cho nhẹ và hiện trên ô vòng quay + màn hình trúng thưởng. Ảnh gắn theo TÊN quà nên dùng chung cho mọi cửa hàng.</p><div class=gal>${NM.map(function(n,i){var im=AD.imgs[n];return `<div class=it><div class=th>${im?`<img src='${im}'>`:'<span>Chưa có ảnh</span>'}</div><b>${esc(n)}</b><label class=sm style='margin:0'>📷 ${im?'Đổi ảnh':'Tải ảnh lên'}<input type=file accept='image/*' data-n='${i}' hidden></label>${im?`<button class=sm data-a='di' data-i='${i}'>Xóa ảnh</button>`:''}</div>`}).join('')}</div>`}function nimg(i,f){var n=NM[i];shrink(f,180,16000,async function(v){try{await call('saveImg',{ten:n,v:v});AD.imgs[n]=v;R()}catch(e){alert(e.message)}},function(){alert('Ảnh quá phức tạp, hãy chọn ảnh khác')})}async function di(i){var n=NM[i];if(!confirm('Xóa ảnh của '+n+'?'))return;try{await call('saveImg',{ten:n,v:''});delete AD.imgs[n];R()}catch(e){alert(e.message)}}function vC(){$('v').innerHTML=`<table>${AD.stores.map(s=>`<tr><td>${esc(s.ten)}</td><td>${s.bat?'<span class=ok>Đang bật</span>':'Đang ẩn'}</td><td><button class=sm data-a='tg' data-i='${esc(s.ten)}'>${s.bat?'Ẩn':'Bật'}</button></td></tr>`).join('')}</table><label>Thêm cửa hàng</label><input id='ns' placeholder='Tên cửa hàng'><button class=btn data-a='addShop'>THÊM</button><p>Nhân viên cần được gán cửa hàng trong tab Admin của Google Sheet.</p>`}async function tg(i){var s=AD.stores.find(x=>x.ten==i);s.bat=!s.bat;R();try{await call('saveStore',{ten:i,toggle:1})}catch(e){s.bat=!s.bat;R();alert(e.message)}}async function addShop(){var t=$('ns').value.trim();if(!t)return;try{await call('saveStore',{ten:t,bat:true});AD.stores.push({ten:t,bat:true});U.stores.push(t);R()}catch(e){alert(e.message)}}function vS(){var c=AD.cfg,u='https://www.baocaonoibo.io.vn/vongquay';$('v').innerHTML=`<label>Tiêu đề trang</label><input id='cT' value='${esc(c.TieuDe)}'><label>Mức hóa đơn áp dụng (chỉ hiển thị trên trang khách, đ)</label><input id='cM' type=number value='${esc(c.MinTien)}'><button class=btn data-a='sc'>LƯU</button><label>Logo (ảnh vuông)</label><input type=file accept='image/*' data-k='Logo' data-w='300'><label>Ảnh nền (không bắt buộc)</label><input type=file accept='image/*' data-k='Nen' data-w='480'><h3>Mã QR</h3><div id='qr' style='background:#fff;padding:10px;display:inline-block'></div><br><a id='dl' class=sm download='qr-vongquay.png'>Tải QR</a><p>${esc(u)}</p>`;new QRCode($('qr'),{text:u,width:240,height:240});setTimeout(()=>{var cv=$('qr').querySelector('canvas');if(cv)$('dl').href=cv.toDataURL()},400)}async function sc(){try{await call('saveCfg',{k:'TieuDe',v:$('cT').value});await call('saveCfg',{k:'MinTien',v:$('cM').value});AD.cfg.TieuDe=$('cT').value;AD.cfg.MinTien=$('cM').value;alert('Đã lưu')}catch(e){alert(e.message)}}function cimg(k,f,w){shrink(f,w,45000,async v=>{try{await call('saveCfg',{k:k,v:v});alert('Đã lưu ảnh')}catch(e){alert(e.message)}},()=>alert('Ảnh quá phức tạp, hãy chọn ảnh khác'))}</script></body></html>
