<!DOCTYPE html><html lang='vi'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Quản lý – Vòng Quay 9 Sạch</title><link rel='stylesheet' href='style.css'><script src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'></script></head><body><main class='wrap' style='max-width:900px'><img class='logo' id='logo' alt='9 Sạch'><h1>🎄 Quản lý vòng quay</h1><div id='lg' class='card'><label>Số điện thoại</label><input id='sd' type='tel'><label>Họ tên</label><input id='tn'><button class='btn' onclick='login()'>ĐĂNG NHẬP</button><p id='er' class='err'></p></div><div id='ad' hidden><div class='bar'><b id='who'></b><button class='sm' onclick='out()'>Thoát</button></div><nav class='tabs'><button data-t='h'>📋 Lịch sử quay</button><button data-t='g' class='m'>🎁 Quà tặng</button><button data-t='c' class='m'>🏬 Cửa hàng</button><button data-t='s' class='m'>⚙️ Cài đặt & QR</button></nav><div id='v' class='card'></div></div></main><script src='app.js'></script><script>var $=i=>document.getElementById(i),AU=null,U=null,H=[],GS='';$('logo').src=CFG.LOGO;async function call(a,d){return api(a,Object.assign({au:AU},d||{}))}async function login(){AU={sdt:$('sd').value,ten:$('tn').value};$('er').textContent='⏳ Đang đăng nhập...';try{U=await call('login');sessionStorage.au=JSON.stringify(AU);start()}catch(e){$('er').textContent=e.message}}function start(){$('lg').hidden=true;$('ad').hidden=false;$('who').textContent=U.ten+(U.mgr?' (quản lý)':' (nhân viên)');document.querySelectorAll('.m').forEach(b=>b.hidden=!U.mgr);GS=U.stores[0]||'';tab('h')}function out(){sessionStorage.clear();location.reload()}if(sessionStorage.au){AU=JSON.parse(sessionStorage.au);call('login').then(r=>{U=r;start()}).catch(()=>{})}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));$('v').onclick=e=>{var b=e.target.closest('button[data-a]');if(b)window[b.dataset.a](b.dataset.i)};$('v').onchange=e=>{var f=e.target;if(f.type=='file')up(f.files[0],f.dataset.k,+f.dataset.w)};async function tab(t){$('v').innerHTML='<p>⏳ Đang tải...</p>';try{await({h:hist,g:gift,c:shops,s:sett}[t])()}catch(e){$('v').innerHTML='<p class=err>'+esc(e.message)+'</p>'}}async function hist(){H=await call('hist');$('v').innerHTML=`<div style='display:grid;gap:6px'><select id='fs' onchange='hr()'><option value=''>Tất cả cửa hàng</option>${U.stores.map(s=>`<option>${esc(s)}</option>`).join('')}</select><input id='fd' type='date' onchange='hr()'><input id='fq' placeholder='Tìm số hóa đơn / SĐT / tên' oninput='hr()'></div><div id='ht' class='tbl'></div>`;hr()}function hr(){var s=$('fs').value,d=$('fd').value,q=$('fq').value.trim().toLowerCase(),dd=d?d.split('-').reverse().join('/'):'';var L=H.filter(r=>(!s||r.ch===s)&&(!dd||r.t.indexOf(dd)==0)&&(!q||(r.hd+r.sdt+r.ten).toLowerCase().indexOf(q)>=0));$('ht').innerHTML='<p>'+L.length+' lượt quay</p><table><tr><th>Thời gian</th><th>Cửa hàng</th><th>Khách</th><th>Hóa đơn</th><th>Quà</th><th>Trạng thái</th></tr>'+L.map(r=>`<tr><td>${r.t}</td><td>${esc(r.ch)}</td><td>${esc(r.ten)}<br>${esc(r.sdt)}</td><td>${esc(r.hd)}</td><td><b>${esc(r.qua)}</b></td><td>${r.tt=='Đã trao'?`<span class=ok>Đã trao</span><br>${esc(r.ng)}`:`<button class=sm data-a='cf' data-i='${r.r}'>XÁC NHẬN ĐÃ TRAO</button>`}</td></tr>`).join('')+'</table>'}async function cf(r){var x=H.find(y=>y.r==r);if(!confirm('Đối chiếu hóa đơn '+x.hd+' - quà: '+x.qua+'. Xác nhận ĐÃ TRAO QUÀ?'))return;try{await call('confirm',{r:r,hd:x.hd});x.tt='Đã trao';x.ng=U.ten;hr()}catch(e){alert(e.message)}}async function gift(){var P=await call('prizes',{store:GS});var row=p=>`<tr><td><input id='n${p.id}' value='${esc(p.ten)}'></td><td><input id='t${p.id}' type=number value='${p.tyle}' style='width:70px'></td><td><input id='q${p.id}' type=number value='${p.sl}' style='width:70px'></td><td><input id='b${p.id}' type=checkbox ${p.bat?'checked':''} style='width:24px'></td><td>${p.id=='new'?'':(p.sl<1?'<b>Hết</b> ':'')}<button class=sm data-a='sp' data-i='${p.id}'>Lưu</button>${p.id=='new'?'':` <button class=sm data-a='dp' data-i='${p.id}'>Xóa</button>`}</td></tr>`;$('v').innerHTML=`<select onchange='GS=this.value;tab("g")'>${U.stores.map(s=>`<option ${s==GS?'selected':''}>${esc(s)}</option>`).join('')}</select><p>Tỷ lệ là trọng số, hệ thống tự chia lại cho đủ 100% theo các quà còn hàng. Quà hết số lượng tự tính 0%.</p><div class=tbl><table><tr><th>Tên quà</th><th>Tỷ lệ %</th><th>Số lượng</th><th>Bật</th><th></th></tr>${P.map(row).join('')}${row({id:'new',ten:'',tyle:10,sl:10,bat:true})}</table></div>`}async function sp(i){try{await call('savePrize',{store:GS,id:i=='new'?'':i,ten:$('n'+i).value,tyle:$('t'+i).value,sl:$('q'+i).value,bat:$('b'+i).checked});tab('g')}catch(e){alert(e.message)}}async function dp(i){if(confirm('Xóa quà này?')){try{await call('delPrize',{id:i,store:GS});tab('g')}catch(e){alert(e.message)}}}async function shops(){var r=await call('stores');$('v').innerHTML=`<table>${r.map(s=>`<tr><td>${esc(s.ten)}</td><td>${s.bat?'<span class=ok>Đang bật</span>':'Đang ẩn'}</td><td><button class=sm data-a='tg' data-i='${esc(s.ten)}'>${s.bat?'Ẩn':'Bật'}</button></td></tr>`).join('')}</table><label>Thêm cửa hàng</label><input id='ns' placeholder='Tên cửa hàng'><button class=btn data-a='addShop'>THÊM</button><p>Nhân viên cần được gán cửa hàng trong tab Admin của Google Sheet.</p>`}async function tg(i){await call('saveStore',{ten:i,toggle:1});tab('c')}async function addShop(){try{await call('saveStore',{ten:$('ns').value,bat:true});U=await call('login');tab('c')}catch(e){alert(e.message)}}async function sett(){var c=(await call('login')).cfg,u='https://www.baocaonoibo.io.vn/vongquay';$('v').innerHTML=`<label>Tiêu đề trang</label><input id='cT' value='${esc(c.TieuDe)}'><label>Mức hóa đơn áp dụng (chỉ hiển thị trên trang khách, đ)</label><input id='cM' type=number value='${esc(c.MinTien)}'><button class=btn data-a='sc'>LƯU</button><label>Logo (ảnh vuông)</label><input type=file accept='image/*' data-k='Logo' data-w='300'><label>Ảnh nền</label><input type=file accept='image/*' data-k='Nen' data-w='480'><h3>Mã QR</h3><div id='qr' style='background:#fff;padding:10px;display:inline-block'></div><br><a id='dl' class=sm download='qr-vongquay.png'>Tải QR</a><p>${esc(u)}</p>`;new QRCode($('qr'),{text:u,width:240,height:240});setTimeout(()=>{var cv=$('qr').querySelector('canvas');if(cv)$('dl').href=cv.toDataURL()},400)}async function sc(){try{await call('saveCfg',{k:'TieuDe',v:$('cT').value});await call('saveCfg',{k:'MinTien',v:$('cM').value});alert('Đã lưu')}catch(e){alert(e.message)}}function up(f,k,w){if(!f)return;var im=new Image();im.onload=async()=>{var s=Math.min(1,w/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);var q=.8,v;do{v=c.toDataURL('image/jpeg',q);q-=.1}while(v.length>45000&&q>.1);if(v.length>45000){alert('Ảnh quá phức tạp, hãy chọn ảnh khác');return}try{await call('saveCfg',{k:k,v:v});alert('Đã lưu ảnh')}catch(e){alert(e.message)}};im.src=URL.createObjectURL(f)}</script></body></html>
