<!DOCTYPE html>
<html lang='vi'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Quản lý game giáng sinh</title>
<link href='https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap' rel='stylesheet'>
<link rel='stylesheet' href='style.css'>
<style>
h1{font-size:26px;margin:6px 0 10px}
body.own #v label.sm{display:none}
.nt{background:#fff3cd;color:#7a4b00;border:3px solid #f0b400;border-radius:14px;padding:12px 14px;margin:8px 0;font-weight:800;font-size:17px;cursor:pointer;text-align:left;animation:ntp 1.2s ease-in-out infinite}
@keyframes ntp{50%{box-shadow:0 0 0 7px #f0b40055}}
.nt small{display:block;font-weight:500;margin-top:4px;font-size:13px}
.nt u{font-weight:700;font-size:14px}
.ss{display:flex;align-items:center;gap:8px;background:#ffffff1f;border-radius:14px;padding:8px 10px;margin:8px 0;text-align:left}
.ss b{white-space:nowrap;color:#ffe9a8;font-size:15px}
.ss select{font-size:18px;font-weight:700;padding:10px}
.tabs{margin:8px 0}
.tabs button{flex:1 1 auto;font-size:15px;padding:11px 10px}
.tabs button.on{background:#fff;color:#0b6b3a;box-shadow:0 0 0 3px #ffc72c}
.fl{display:flex;gap:6px;margin-bottom:8px}
.fl button{flex:1;padding:11px 6px;border:2px solid #0b6b3a;background:#fff;color:#0b6b3a;border-radius:12px;font-weight:800;font-family:inherit;font-size:15px;cursor:pointer}
.fl button.on{background:#0b6b3a;color:#fff}
.light input{margin-bottom:6px}
.rc{border:2px solid #e6dcdc;border-radius:14px;padding:10px 12px;margin:8px 0;color:#222;line-height:1.5}
.rc.w{border-color:#f0b400;background:#fffaf0}
.rc.d{background:#f3faf5;border-color:#b9dfc6}
.rc .rt{display:flex;justify-content:space-between;gap:8px;font-size:17px}
.rc .rt span{font-size:13px;color:#777;white-space:nowrap}
.go{display:block;width:100%;margin-top:8px;padding:14px;font-size:18px;font-weight:800;border:0;border-radius:12px;background:#0b6b3a;color:#fff;font-family:inherit;cursor:pointer}
.hint{font-size:13px;color:#666}
.warn{background:#ffe3e3;color:#a00;border-radius:12px;padding:10px 12px;font-weight:700;margin:8px 0;text-align:left;font-size:14px}
.cs{display:block;width:100%;text-align:left;margin:6px 0;padding:14px;font:inherit;font-size:18px;font-weight:700;border-radius:12px;border:2px solid #f0b400;background:#fffaf0;cursor:pointer}
</style>
<script src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'></script>
<script src='poster.js?v=1'></script>
</head>
<body>
<div class='lights'></div>
<main class='wrap' style='max-width:900px'>
<img class='logo' id='logo' alt='9 Sạch'>
<h1>🎄 Quản lý game giáng sinh</h1>

<div id='bx' class='card light'>
<p id='bm' style='font-weight:700;color:#333;text-align:center;margin:6px 0'>⏳ Đang vào trang quản lý...</p>
<button id='bb' class='btn' hidden onclick='boot()'>🔄 THỬ LẠI</button>
</div>

<div id='ad' hidden>
<div id='wn' class='warn' hidden>⚠️ Máy chủ chưa bật quyền quản lý nên trang chỉ xem và trao quà được. Cần cập nhật Code.gs và triển khai lại (xem file HANDOFF.md).</div>
<div id='nt' class='nt' role='button' hidden onclick='goPend()'></div>
<div class='ss'><b>🏬 Cửa hàng:</b><select id='gs'></select></div>
<nav class='tabs'>
<button data-t='h'>🎁 Trao thưởng</button>
<button data-t='g' class='m'>🎄 Quà tặng</button>
<button data-t='i' class='m'>🖼️ Ảnh quà</button>
<button data-t='c' class='m'>🏬 Cửa hàng</button>
<button data-t='s' class='m'>⚙️ Cài đặt & QR</button>
<button data-t='q'>📱 QR cửa hàng</button>
</nav>
<div id='v' class='card light'></div>
</div>
</main>
<script src='app.js'></script>
<script>
var $=i=>document.getElementById(i),AU=(function(){var p=new URLSearchParams(location.hash.slice(1)),o={sdt:'',ten:''};if(p.get('ch')&&p.get('k')){o.ch=p.get('ch');o.k=p.get('k')}else if(p.get('mk'))o.mk=p.get('mk');return o})(),KEYS=null,U=null,H=null,AD=null,ST='',T='h',NM=[],HT=0,FD='',FQ='',FT='p',AL=0,LT=0,PN=-1,PT=0,TT='Quản lý game giáng sinh';
if(typeof CFG!=='undefined'&&CFG.LOGO)$('logo').src=CFG.LOGO;else $('logo').style.display='none';

/* ---------- Gọi máy chủ ---------- */
async function call(a,d){
 var body=JSON.stringify(Object.assign({a:a,au:AU},d||{})),n=(a=='login'||a=='hist'||a=='adminAll')?2:1,err;
 for(var k=0;k<n;k++){
  var ac=new AbortController(),tm=setTimeout(function(){ac.abort()},30000);
  try{
   var r=await fetch(CFG.API,{method:'POST',body:body,signal:ac.signal});
   var j=await r.json();clearTimeout(tm);
   if(!j.ok){var se=new Error(j.m);se.srv=1;throw se}
   return j.d
  }catch(e){clearTimeout(tm);if(e.srv)throw e;err=new Error('Máy chủ phản hồi quá chậm hoặc mất kết nối, bấm Thử lại')}
 }
 throw err
}
function ld(){var t0=Date.now();clearInterval(LT);$('v').innerHTML='<p>⏳ Đang tải... <span id=lt></span></p>';LT=setInterval(function(){var s=$('lt');if(!s){clearInterval(LT);return}s.textContent=Math.round((Date.now()-t0)/1000)+' giây'},1000)}
function er(e){clearInterval(LT);$('v').innerHTML='<p class=err>'+esc(e.message)+'</p><button class=sm data-a="retry">🔄 Thử lại</button>'}
function retry(){if(T=='h'){H=null;ld();loadH()}else{AD=null;ld();loadA()}}

/* ---------- Vào thẳng, không đăng nhập ---------- */
async function boot(){
 $('bm').style.color='#333';$('bm').textContent='⏳ Đang vào trang quản lý...';$('bb').hidden=true;
 try{U=await call('login');start()}
 catch(e){$('bm').style.color='#c8102e';$('bm').textContent=e.message;$('bb').hidden=false}
}
function start(){
 $('bx').hidden=true;$('ad').hidden=false;
 document.querySelectorAll('.m').forEach(b=>b.hidden=!U.mgr&&!(U.own&&b.dataset.t=='g'));
 $('wn').hidden=!!(U.mgr||U.own);
 if(U.own){document.body.classList.add('own');TT='Admin – '+U.own;document.title=TT;document.querySelector('h1').textContent='🎄 Admin – '+U.own}
 var sv='';try{sv=localStorage.vq_store||''}catch(e){}
 ST=U.own?U.own:(U.stores.indexOf(sv)>=0?sv:'');
 fillS();
 try{if(!H&&sessionStorage.hc)H=JSON.parse(sessionStorage.hc)}catch(e){}
 tab('h');poll();clearInterval(PT);PT=setInterval(poll,20000)
}

/* ---------- Chọn cửa hàng (dùng chung cho mọi mục) ---------- */
function fillS(){$('gs').innerHTML=(U.own?'':'<option value="">🌐 Tất cả cửa hàng</option>')+U.stores.map(s=>`<option value="${esc(s)}" ${s==ST?'selected':''}>🏬 ${esc(s)}</option>`).join('')}
function setS(v){ST=v;if(!U.own){try{localStorage.vq_store=v}catch(e){}}R()}
function pickS(n){setS(n);fillS()}
$('gs').onchange=function(){setS(this.value)};

/* ---------- Thông báo: bấm vào là tới phần Trao thưởng ---------- */
function beep(){try{var a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.6);o.start();o.stop(a.currentTime+.6)}catch(e){}}
async function poll(){
 if(!U)return;
 try{
  var r=await call('pending'),b=$('nt');
  if(r.n>0){
   b.hidden=false;
   b.innerHTML='🔔 Có '+r.n+' lượt trúng quà đang chờ trao<br><u>👉 Bấm vào đây để đi tới phần TRAO THƯỞNG</u><small>'+r.latest.map(x=>esc(x.ch)+': '+esc(x.ten||'')+' – '+esc(x.qua)).join(' • ')+'</small>';
   document.title='('+r.n+') '+TT;
   if(PN>=0&&r.n>PN){beep();loadH()}
  }else{b.hidden=true;document.title=TT}
  PN=r.n
 }catch(e){}
}
function goPend(){
 FT='p';FQ='';FD='';ST=U.own||'';$('gs').value=ST;T='h';H=null;
 R();loadH();
 try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){}
}

/* ---------- Chuyển mục ---------- */
function tab(t){T=t;R();if(t=='h'){if(Date.now()-HT>30000)loadH()}else if(U&&(U.mgr||U.own))ensureA()}
function R(){
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==T));
 if(T=='h')vH();else if(T=='q')vQ();else if(!AD)ld();else({g:vG,c:vC,s:vS,i:vI})[T]()
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
$('v').onclick=e=>{var b=e.target.closest('button[data-a]');if(b)window[b.dataset.a](b.dataset.i)};
$('v').onchange=e=>{var f=e.target;if(f.type!='file')return;if(f.dataset.p)pimg(f.dataset.p,f.files[0]);else if(f.dataset.n)nimg(f.dataset.n,f.files[0]);else cimg(f.dataset.k,f.files[0],+f.dataset.w)};
async function loadA(){AL=1;try{AD=await call('adminAll');if(T!='h')R()}catch(e){if(T!='h')er(e)}AL=0}
function ensureA(){if(!AD&&!AL)loadA()}

/* ---------- Mục TRAO THƯỞNG ---------- */
async function loadH(){
 try{
  H=await call('hist');HT=Date.now();
  try{sessionStorage.hc=JSON.stringify(H)}catch(e){}
  if(T=='h'){if($('ht'))hr();else vH()}
 }catch(e){if(T=='h'&&!H)er(e)}
 if(U&&(U.mgr||U.own))ensureA()
}
function fT(x){FT=x||'';vH()}
function vH(){
 if(!H){ld();return}
 $('v').innerHTML=`<div class='fl'>${[['p','⏳ Chờ trao'],['d','✅ Đã trao'],['','📋 Tất cả']].map(x=>`<button class='${FT==x[0]?'on':''}' data-a='fT' data-i='${x[0]}'>${x[1]}</button>`).join('')}</div><input id='fq' value='${esc(FQ)}' placeholder='🔍 Tìm số hóa đơn / SĐT / tên khách' oninput='FQ=this.value;hr()'><label>Lọc theo ngày (không bắt buộc)</label><input id='fd' type='date' value='${esc(FD)}' onchange='FD=this.value;hr()'><button class=sm data-a='loadH'>🔄 Làm mới</button><div id='ht'></div>`;
 hr()
}
function card(r){
 var done=r.tt=='Đã trao',wait=r.tt=='Chờ nhập thông tin';
 return `<div class='rc ${done?'d':wait?'':'w'}'><div class='rt'><b>🎁 ${esc(r.qua)}</b><span>${esc(r.t)}</span></div><div>🏬 ${esc(r.ch)}</div><div>👤 ${esc(r.ten)} · ${esc(r.sdt)}</div><div>🧾 Hóa đơn: <b>${esc(r.hd)}</b></div>`
  +(done?`<div class=ok>✅ Đã trao${r.ng?' – '+esc(r.ng):''}</div>`:wait?'<div class=hint><i>⏳ Khách đang nhập thông tin…</i></div>':`<button class='go' data-a='cf' data-i='${r.r}'>🎁 TRAO QUÀ</button>`)
  +'</div>'
}
function hr(){
 var q=FQ.trim().toLowerCase(),dd=FD?FD.split('-').reverse().join('/'):'';
 var L=H.filter(r=>(!ST||r.ch===ST)&&(!FT||(FT=='p'?r.tt!='Đã trao':r.tt=='Đã trao'))&&(!dd||r.t.indexOf(dd)==0)&&(!q||(r.hd+r.sdt+r.ten).toLowerCase().indexOf(q)>=0));
 $('ht').innerHTML='<p><b>'+L.length+'</b> lượt – '+(ST?esc(ST):'tất cả cửa hàng')+'</p>'
  +(L.length?L.map(card).join(''):'<p class=hint>'+(FT=='p'?'🎉 Không có quà nào đang chờ trao.':'Không có kết quả.')+'</p>')
  +'<p class=hint>Lịch sử được giữ vĩnh viễn, không thể xóa. Quà chỉ bị trừ khỏi kho khi bấm TRAO QUÀ.</p>'
}
async function cf(r){
 var x=H.find(y=>y.r==r);
 if(!confirm('Đối chiếu hóa đơn '+x.hd+' - quà: '+x.qua+'. Xác nhận ĐÃ TRAO QUÀ (quà sẽ bị trừ khỏi kho cửa hàng)?'))return;
 try{await call('confirm',{r:r,hd:x.hd});x.tt='Đã trao';x.ng=U.ten;PN=-1;poll();try{sessionStorage.hc=JSON.stringify(H)}catch(e){}hr()}
 catch(e){alert(e.message)}
}

/* ---------- Mục QUÀ TẶNG ---------- */
function shrink(f,w,mx,ok,bad){if(!f)return;var im=new Image();im.onload=function(){var s=Math.min(1,w/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));var x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);var q=.85,t='image/webp',v=c.toDataURL(t,q);if(v.indexOf('image/webp')<0){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);t='image/jpeg';v=c.toDataURL(t,q)}while(v.length>mx&&q>.2){q-=.1;v=c.toDataURL(t,q)}v.length>mx?bad():ok(v)};im.src=URL.createObjectURL(f)}
function vG(){
 if(!ST){$('v').innerHTML='<h3>👆 Chọn cửa hàng cần chỉnh quà</h3><p class=hint>Bấm vào tên cửa hàng, hoặc chọn ở ô "Cửa hàng" phía trên.</p>'+U.stores.map(s=>`<button class=cs data-a='pickS' data-i='${esc(s)}'>🏬 ${esc(s)}</button>`).join('');return}
 var row=p=>{var im=AD.imgs[p.ten],n=p.id=='new';return `<tr><td>${!n&&im?`<img src='${im}' style='width:44px;height:44px;object-fit:contain;vertical-align:middle'> `:''}<input id='n${p.id}' value='${esc(p.ten)}'></td><td><input id='t${p.id}' type=number value='${p.tyle}' style='width:70px'></td><td><input id='q${p.id}' type=number value='${p.sl}' style='width:70px'></td><td><input id='b${p.id}' type=checkbox ${p.bat?'checked':''} style='width:24px'></td><td>${n?'':(p.sl<1?'<b>Hết</b> ':'')+`<label class=sm style='display:inline-block;margin:0'>📷 Ảnh<input type=file accept='image/*' data-p='${p.id}' hidden></label> `}<button id='s${p.id}' class=sm data-a='sp' data-i='${p.id}'>Lưu</button>${n?'':` <button class=sm data-a='dp' data-i='${p.id}'>Xóa</button>`}</td></tr>`};
 $('v').innerHTML=`<h3>🎄 Quà tặng – ${esc(ST)}</h3><p class=hint>Sửa xong bấm <b>Lưu</b> ở cuối dòng. Dòng trống cuối bảng dùng để <b>thêm quà mới</b>. Tỷ lệ là trọng số, hệ thống tự chia lại cho đủ 100% theo các quà còn hàng. Quà hết số lượng tự tính 0%. Ảnh gắn theo TÊN quà (dùng chung các cửa hàng).</p><div class=tbl><table><tr><th>Tên quà</th><th>Tỷ lệ %</th><th>Số lượng</th><th>Bật</th><th></th></tr>${AD.prizes.filter(p=>p.store==ST).map(row).join('')}${row({id:'new',ten:'',tyle:10,sl:10,bat:true})}</table></div>`
}
async function sp(i){var b=$('s'+i);b.textContent='⏳';try{var r=await call('savePrize',{store:ST,id:i=='new'?'':i,ten:$('n'+i).value,tyle:$('t'+i).value,sl:$('q'+i).value,bat:$('b'+i).checked});var k=AD.prizes.findIndex(x=>x.id==r.id&&x.store==ST);if(k<0)AD.prizes.push(r);else AD.prizes[k]=r;R()}catch(e){b.textContent='Lưu';alert(e.message)}}
async function dp(i){if(!confirm('Xóa quà này?'))return;try{await call('delPrize',{id:i,store:ST});AD.prizes=AD.prizes.filter(x=>!(x.id==i&&x.store==ST));R()}catch(e){alert(e.message)}}
function pimg(id,f){var p=AD.prizes.find(x=>x.id==id&&x.store==ST);shrink(f,180,16000,async v=>{try{await call('saveImg',{ten:p.ten,v:v});AD.imgs[p.ten]=v;R()}catch(e){alert(e.message)}},()=>alert('Ảnh quá phức tạp, hãy chọn ảnh khác'))}

/* ---------- Mục ẢNH QUÀ ---------- */
function vI(){NM=Object.keys(AD.prizes.reduce(function(o,p){o[p.ten]=1;return o},{}));$('v').innerHTML=`<p>Bấm <b>Tải ảnh lên</b> ở từng sản phẩm. Nên chọn ảnh vuông, nền trắng hoặc nền trong suốt. Ảnh tự thu nhỏ cho nhẹ và hiện trên ô vòng quay + màn hình trúng thưởng. Ảnh gắn theo TÊN quà nên dùng chung cho mọi cửa hàng.</p><div class=gal>${NM.map(function(n,i){var im=AD.imgs[n];return `<div class=it><div class=th>${im?`<img src='${im}'>`:'<span>Chưa có ảnh</span>'}</div><b>${esc(n)}</b><label class=sm style='margin:0'>📷 ${im?'Đổi ảnh':'Tải ảnh lên'}<input type=file accept='image/*' data-n='${i}' hidden></label>${im?`<button class=sm data-a='di' data-i='${i}'>Xóa ảnh</button>`:''}</div>`}).join('')}</div>`}
function nimg(i,f){var n=NM[i];shrink(f,180,16000,async function(v){try{await call('saveImg',{ten:n,v:v});AD.imgs[n]=v;R()}catch(e){alert(e.message)}},function(){alert('Ảnh quá phức tạp, hãy chọn ảnh khác')})}
async function di(i){var n=NM[i];if(!confirm('Xóa ảnh của '+n+'?'))return;try{await call('saveImg',{ten:n,v:''});delete AD.imgs[n];R()}catch(e){alert(e.message)}}

/* ---------- Mục CỬA HÀNG ---------- */
function vC(){$('v').innerHTML=`<table>${AD.stores.map(s=>`<tr><td>${esc(s.ten)}</td><td>${s.bat?'<span class=ok>Đang bật</span>':'Đang ẩn'}</td><td><button class=sm data-a='tg' data-i='${esc(s.ten)}'>${s.bat?'Ẩn':'Bật'}</button></td></tr>`).join('')}</table><label>Thêm cửa hàng</label><input id='ns' placeholder='Tên cửa hàng'><button class=btn data-a='addShop'>THÊM</button>`}
async function tg(i){var s=AD.stores.find(x=>x.ten==i);s.bat=!s.bat;R();try{await call('saveStore',{ten:i,toggle:1})}catch(e){s.bat=!s.bat;R();alert(e.message)}}
async function addShop(){var t=$('ns').value.trim();if(!t)return;try{await call('saveStore',{ten:t,bat:true});AD.stores.push({ten:t,bat:true});U.stores.push(t);fillS();R()}catch(e){alert(e.message)}}

/* ---------- Mục QR CỬA HÀNG: 2 mã (khách đua cọp / nhân viên admin) ---------- */
function qrBox(id,text,name){return `<div id='${id}' style='background:#fff;padding:10px;display:inline-block'></div><br><a id='${id}d' class=sm download='${name}.png'>⬇️ Tải QR</a><p class=hint style='word-break:break-all'>${esc(text)}</p>`}
function qrDraw(id,text){new QRCode($(id),{text:text,width:230,height:230});setTimeout(()=>{var cv=$(id).querySelector('canvas');if(cv)$(id+'d').href=cv.toDataURL()},400)}
async function vQ(){
 var s=U.own||ST;
 if(!s){$('v').innerHTML='<h3>👆 Chọn cửa hàng để tạo QR</h3>'+U.stores.map(x=>`<button class=cs data-a='pickS' data-i='${esc(x)}'>🏬 ${esc(x)}</button>`).join('');return}
 var k=U.own?AU.k:(KEYS&&KEYS[s]);
 if(!k){$('v').innerHTML='<p>⏳ Đang tạo mã...</p>';try{var a=await call('storeLinks');KEYS={};a.forEach(x=>KEYS[x.ten]=x.k);k=KEYS[s]}catch(e){return er(e)}if(T!='q')return}
 var gb='';try{gb=localStorage.vq_game||''}catch(e){}gb=gb||'https://tp9sach-ops.github.io/luutru/';
 var gu=gb+(gb.indexOf('?')>=0?'&':'?')+'ch='+encodeURIComponent(s),au=location.href.split('#')[0]+'#ch='+encodeURIComponent(s)+'&k='+encodeURIComponent(k);
 $('v').innerHTML=`<h3>📱 QR – ${esc(s)}</h3><h3>1️⃣ QR cho KHÁCH (vào trang đua cọp của cửa hàng này)</h3>${qrBox('q1',gu,'qr-khach-'+esc(s))}<h3>2️⃣ QR cho NHÂN VIÊN (vào trang admin của cửa hàng này)</h3><div class=warn>🔒 QR này là chìa khóa admin: chỉ dán ở khu vực nhân viên, KHÔNG đặt chỗ khách nhìn thấy.</div>${qrBox('q2',au,'qr-admin-'+esc(s))}${U.mgr?`<button class=sm data-a='rk' data-i='${esc(s)}'>🔑 Đổi mã admin (QR admin cũ hết hiệu lực)</button>`:''}`;
 qrDraw('q1',gu);qrDraw('q2',au);
 if(window.drawPoster)drawPoster(s,gu,((AD&&AD.cfg)||U.cfg||{}).MinTien)
}
async function rk(s){if(!confirm('Đổi mã admin của '+s+'? QR admin đã in trước đó sẽ không dùng được nữa.'))return;try{var k=await call('resetKey',{ten:s});if(!KEYS)KEYS={};KEYS[s]=k;vQ()}catch(e){alert(e.message)}}

/* ---------- Mục CÀI ĐẶT & QR ---------- */
function vS(){var c=AD.cfg,u='https://www.baocaonoibo.io.vn/vongquay';$('v').innerHTML=`<label>Tiêu đề trang</label><input id='cT' value='${esc(c.TieuDe)}'><label>Mức hóa đơn áp dụng (chỉ hiển thị trên trang khách, đ)</label><input id='cM' type=number value='${esc(c.MinTien)}'><button class=btn data-a='sc'>LƯU</button><label>Logo (ảnh vuông)</label><input type=file accept='image/*' data-k='Logo' data-w='300'><label>Ảnh nền (không bắt buộc)</label><input type=file accept='image/*' data-k='Nen' data-w='480'><h3>Mã QR</h3><div id='qr' style='background:#fff;padding:10px;display:inline-block'></div><br><a id='dl' class=sm download='qr-vongquay.png'>Tải QR</a><p>${esc(u)}</p>`;new QRCode($('qr'),{text:u,width:240,height:240});setTimeout(()=>{var cv=$('qr').querySelector('canvas');if(cv)$('dl').href=cv.toDataURL()},400)}
async function sc(){try{await call('saveCfg',{k:'TieuDe',v:$('cT').value});await call('saveCfg',{k:'MinTien',v:$('cM').value});AD.cfg.TieuDe=$('cT').value;AD.cfg.MinTien=$('cM').value;alert('Đã lưu')}catch(e){alert(e.message)}}
function cimg(k,f,w){shrink(f,w,45000,async v=>{try{await call('saveCfg',{k:k,v:v});alert('Đã lưu ảnh')}catch(e){alert(e.message)}},()=>alert('Ảnh quá phức tạp, hãy chọn ảnh khác'))}

boot();
